name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt pyinstaller

      - name: Build
        run: python -m PyInstaller --noconfirm --clean skill_manager.spec

      - name: Zip
        run: Compress-Archive -Path dist/SkillManager -DestinationPath SkillManager-windows-x64.zip

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: SkillManager-windows-x64.zip
          generate_release_notes: true
